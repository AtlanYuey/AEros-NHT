name: Android Native

# Native Android app in android-native/ (Kotlin, Jetpack Compose).
on:
  push:
    branches:
      - 'master'
      - 'claude/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft GitHub release with the APK
        type: boolean
        default: false
      publish:
        description: Publish the GitHub release with the APK right away
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner has an Android SDK; add the platform and build tools.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release signing key from repository secrets (see android-native/README.md).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASING: ${{ contains(github.event.head_commit.message, '[android-release]') || contains(github.event.head_commit.message, '[android-publish]') || inputs.release || inputs.publish }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$RELEASING" = "true" ]; then
            # A release must be signed with the release key, or it can't update installed copies.
            echo "::error::No signing key secrets: add them (android-native/README.md) before releasing."
            exit 1
          else
            echo "::warning::No signing key secrets: the APK is signed with a temporary debug key and cannot update an installed release."
          fi

      - name: Build
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package APK
        working-directory: android-native
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AEros-NHT_${VERSION}_${CODE}.apk"
          ls -lh dist
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$CODE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aeros-nht-android
          path: android-native/dist/*.apk
          if-no-files-found: error

      # One release per version: publishing replaces an existing release
      # of this version (and moves its tag to this commit).
      - name: Replace an existing release of this version
        if: contains(github.event.head_commit.message, '[android-publish]') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "android-v${APP_VERSION}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      # [android-release] in the commit message (or a manual run with
      # "release") drafts a GitHub release; [android-publish] (or "publish")
      # publishes it right away.
      - name: GitHub release
        if: contains(github.event.head_commit.message, '[android-release]') || contains(github.event.head_commit.message, '[android-publish]') || inputs.release || inputs.publish
        uses: ncipollo/release-action@v1
        with:
          tag: android-v${{ env.APP_VERSION }}
          commit: ${{ github.sha }}
          name: AEros-NHT ${{ env.APP_VERSION }} (${{ env.APP_BUILD }}) · Android
          bodyFile: android-native/RELEASE_NOTES.md
          artifacts: android-native/dist/*.apk
          draft: ${{ !(contains(github.event.head_commit.message, '[android-publish]') || inputs.publish) }}
          makeLatest: false
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
