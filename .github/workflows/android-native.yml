name: Android Native

# Native Android app in android-native/ (Kotlin, Jetpack Compose). Releases
# are made by native-release.yml, together with the iOS app.
on:
  push:
    branches:
      - 'master'
      - 'claude/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_call:
    inputs:
      for_release:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: android-native-${{ github.ref }}${{ inputs.for_release && '-release' || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    # A [publish] commit is built by native-release.yml.
    if: inputs.for_release || !contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner has an Android SDK; add the platform and build tools.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release signing key from repository secrets (see android-native/README.md).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASING: ${{ inputs.for_release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$RELEASING" = "true" ]; then
            # A release must be signed with the release key, or it can't update installed copies.
            echo "::error::No signing key secrets: add them (android-native/README.md) before releasing."
            exit 1
          else
            echo "::warning::No signing key secrets: the APK is signed with a temporary debug key and cannot update an installed release."
          fi

      - name: Build
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package APK
        working-directory: android-native
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AEros-NHT_${VERSION}_${CODE}.apk"
          ls -lh dist

      # A release must be signed with the release key, or it can't update installed copies.
      - name: Check the signature
        if: inputs.for_release
        working-directory: android-native
        run: |
          CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs dist/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Certificate SHA-256: $CERT"
          if [ "$CERT" != "771e046f9b71d6ef6da71a5c441b4578fe8a80bc8d7c76307a1c4f353c4734a9" ]; then
            echo "::error::The APK is not signed with the release key."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aeros-nht-android
          path: android-native/dist/*.apk
          if-no-files-found: error
