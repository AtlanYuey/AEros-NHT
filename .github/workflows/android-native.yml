name: Android Native

# Native Android app in android-native/ (Kotlin, Jetpack Compose).
on:
  push:
    branches:
      - 'master'
      - 'claude/**'
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft GitHub release with the APK
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release signing key from repository secrets (see android-native/README.md).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets: the APK is signed with a temporary debug key and cannot update an installed release."
          fi

      - name: Build
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package APK
        working-directory: android-native
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AEros-NHT_${VERSION}_${CODE}.apk"
          ls -lh dist
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$CODE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aeros-nht-android
          path: android-native/dist/*.apk
          if-no-files-found: error

      # [android-release] in the commit message drafts a GitHub release;
      # [android-publish] publishes it right away.
      - name: GitHub release
        if: contains(github.event.head_commit.message, '[android-release]') || contains(github.event.head_commit.message, '[android-publish]') || inputs.release
        uses: ncipollo/release-action@v1
        with:
          tag: android-v${{ env.APP_VERSION }}
          commit: ${{ github.sha }}
          name: AEros-NHT ${{ env.APP_VERSION }} (${{ env.APP_BUILD }}) · Android
          bodyFile: android-native/RELEASE_NOTES.md
          artifacts: android-native/dist/*.apk
          draft: ${{ !contains(github.event.head_commit.message, '[android-publish]') }}
          makeLatest: false
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
