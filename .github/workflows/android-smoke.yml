name: Android Smoke Test

# Runs an APK on emulators (several Android versions): opens it, sends it to
# the background and back, taps around with the monkey and reports crashes.
# By default it tests the APK of the latest GitHub release.
on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'android-native/scripts/smoke-test.sh'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose APK to test (empty = latest release)
        type: string
        default: ''

jobs:
  smoke:
    name: Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            arch: x86
          - api: 30
            arch: x86_64
          - api: 34
            arch: x86_64
          - api: 36
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p apk
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern '*.apk' --dir apk --repo "$GITHUB_REPOSITORY"
          else
            gh release download --pattern '*.apk' --dir apk --repo "$GITHUB_REPOSITORY"
          fi
          ls -l apk
          echo "APK=$(ls apk/*.apk | head -1)" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: android-native/scripts/smoke-test.sh "$APK" smoke-out

      - name: Result
        if: always()
        run: |
          cat smoke-out/result.txt 2>/dev/null || echo "no result"
          grep -q OK smoke-out/result.txt

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-android-${{ matrix.api }}
          path: smoke-out
          if-no-files-found: ignore
