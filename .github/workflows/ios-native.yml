name: iOS Native

# Native SwiftUI app in apple/ (iOS 18+, iPhone and iPad).
on:
  push:
    branches:
      - 'master'
      - 'claude/**'
    paths:
      - 'apple/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft GitHub release with the IPA
        type: boolean
        default: false
      runner:
        description: macOS runner image (both have Xcode 26)
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apple
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: apple/build/SourcePackages
          key: spm-${{ hashFiles('apple/project.yml') }}

      - name: Build
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild \
            -project ErosN.xcodeproj \
            -scheme ErosN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        working-directory: apple
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        working-directory: apple
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "../AEros-NHT_${VERSION}_${BUILD}.ipa" Payload)
          ls -lh build/*.ipa
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: aeros-nht-ios
          path: apple/build/*.ipa
          if-no-files-found: error

      # A commit message containing [release] (or a manual run with
      # "release") drafts a GitHub release to publish on GitHub;
      # [publish] publishes it right away.
      - name: GitHub release
        if: contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[publish]') || inputs.release
        uses: ncipollo/release-action@v1
        with:
          tag: ios-v${{ env.APP_VERSION }}
          commit: ${{ github.sha }}
          name: AEros-NHT ${{ env.APP_VERSION }} (${{ env.APP_BUILD }}) · iOS / iPadOS
          bodyFile: apple/RELEASE_NOTES.md
          artifacts: apple/build/*.ipa
          draft: ${{ !contains(github.event.head_commit.message, '[publish]') }}
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
