name: Release

on:
  push:
    branches:
      - 'master'
      - 'claude/**'
    tags:
      - 'v*'
    # The native iOS app has its own workflow.
    paths-ignore:
      - 'apple/**'
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      - '.github/workflows/ios-native.yml'
      - '.github/workflows/native-release.yml'
      - '**.md'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ios:
    name: Build iOS (unsigned IPA)
    # Needs Xcode 26 / the iOS 26 SDK: UIKit only renders Liquid Glass for
    # apps built against it. Both images ship Xcode 26 (selected below).
    # macOS runners are sometimes unavailable for one image for a while, so
    # build on both and use whichever finishes; the IPAs are equivalent.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get app version
        shell: bash
        run: |
          app_version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          echo "app_version=${app_version}" >> "$GITHUB_ENV"
          echo "App version: ${app_version}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          case "$SDK" in
            2[6-9]*|[3-9][0-9]*) ;;
            *) echo "::warning::iOS SDK $SDK < 26: native Liquid Glass will not render" ;;
          esac

      - name: Show toolchain
        run: |
          flutter --version
          pod --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS app
        run: |
          sed -i '' 's/com.dev.honjow.erosn/com.honjow.erosn/g' ios/Runner.xcodeproj/project.pbxproj
          flutter build ios --release --no-codesign --build-name="${app_version%%+*}" --build-number="${app_version##*+}"

      - name: Package IPA
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "../Eros-N_${app_version}.ipa" Payload
          cd ..
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-${{ matrix.runner }}
          path: build/*.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    # Publish as long as at least one of the builds produced an IPA.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    needs: build_ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get app version
        shell: bash
        run: |
          app_version=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2)
          echo "app_version=${app_version}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-ios-*
          merge-multiple: true
          path: /tmp/artifacts/release-ios

      - run: ls -R /tmp/artifacts

      - name: Upload to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/artifacts/release-ios/*.ipa
          tag: ${{ github.ref_name }}
          name: Eros-N ${{ github.ref_name }}
          bodyFile: changelog/v${{ env.app_version }}.md
          prerelease: ${{ contains(github.ref_name, 'pre') || contains(github.ref_name, 'beta') }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
