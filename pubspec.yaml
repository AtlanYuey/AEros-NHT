name: eros_n
description: An unofficial nhentai app.

publish_to: 'none'
version: 1.1.0+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  collection: ^1.18.0
  crypto: ^3.0.6
  logger: ^2.0.2+1
  path_provider: ^2.1.4
  intl: any
  dynamic_color: ^1.7.0
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.10.0
  html: ^0.15.4
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  octo_image: ^2.1.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.2
  flutter_list_view: ^1.1.28
  tuple: ^2.0.2
  waterfall_flow: ^3.1.1
  hooks_riverpod: ^2.4.5
  auto_route: ^7.8.4
  flutter_smart_dialog: ^4.9.8
  sliver_tools: ^0.2.12
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  photo_view: ^0.15.0
  preload_page_view: ^0.2.0
  flutter_hooks: ^0.20.5
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  copy_with_extension: ^5.0.4
  path: ^1.9.0
  archive: ^3.6.1
  package_info_plus: ^8.0.0
  rotated_corner_decoration: ^2.1.0
  webview_windows:
    git:
      url: https://github.com/xioxin/flutter-webview-windows.git
      ref: 4837e6d
  system_network_proxy:
    git:
      url: https://github.com/honjow/system_network_proxy.git
      path: system_network_proxy
  system_proxy: ^0.1.0
  keframe: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  gesture_zoom_box: ^0.0.4
  flutter_keyboard_visibility: ^6.0.0
  flutter_typeahead: ^5.2.0
  bitsdojo_window: ^0.1.6
  fluentui_system_icons: ^1.1.221
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size
  palette_generator: ^0.3.3+4
  nil: ^1.1.1
  receive_sharing_intent: ">=1.8.0 <1.9.0"
  open_by_default:
    git:
      url: https://github.com/honjow/open_by_default.git
  flutter_android_volume_keydown:
    git:
      url: https://github.com/honjow/flutter_android_volume_keydown.git
      ref: dev
  wakelock_plus: ^1.2.8
  uuid: ^4.4.0
  easy_debounce: ^2.0.3
  flutter_socks_proxy: ^0.0.3
  # Vendored with a patch: the button group did not pass dark mode to the
  # native view (third_party/native_liquid_glass, MIT).
  native_liquid_glass:
    path: third_party/native_liquid_glass

dev_dependencies:
  # dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  copy_with_extension_gen: ^5.0.4
  isar_generator: 3.1.0+1
  auto_route_generator: ^7.3.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  freezed: ^2.4.5


flutter:
  uses-material-design: true
  assets:
    - assets/images/
  shaders:
    - shaders/liquid_glass.frag
    - shaders/variable_blur.frag

flutter_intl:
  enabled: true
  class_name: L10n


# flutter pub run index_generator
index_generator:
  exclude:
    - '**.g.dart'
    - '**.freezed.dart'
  indexes:
    - path: lib/component/models
      name: index
    - path: lib/common/parser
      name: parser